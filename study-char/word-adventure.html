<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="听单词、找字母，随机认识英文单词，拼对就能获得积分。">
  <title>单词小冒险 · 键盘小课堂</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2338685b'/%3E%3Ctext x='16' y='24' text-anchor='middle' font-size='24'%3E🐱%3C/text%3E%3C/svg%3E">
  <style>
    :root { font-family: system-ui, "Microsoft YaHei", sans-serif; color: #29463d; background: #f8f5ed; --green: #38685b; --muted: #748177; --gold: #e7aa50; }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(ellipse at 12% 14%, #f0eadb 0, transparent 40%), #f8f5ed; }
    button { font: inherit; cursor: pointer; touch-action: manipulation; }
    button:focus-visible { outline: 3px solid #ba7525; outline-offset: 5px; }
    button:disabled { cursor: default; }
    main { max-width: 1080px; margin: auto; padding: 28px 28px 24px; }
    .header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 23px; }
    .brand { margin: 0; font-weight: 750; font-size: 19px; letter-spacing: 1px; }
    .brand span { display: inline-grid; place-items: center; width: 34px; height: 34px; margin-right: 10px; border-radius: 11px; background: var(--green); color: #fffaf0; }
    .score { display: inline-flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 12px; background: #f3e8ce; color: #806024; font-size: 13px; white-space: nowrap; }
    .score strong { font-size: 18px; }
    .score-value { position: relative; display: inline-block; }
    .score-burst { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
    .score-burst::before { content: ''; position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; border: 2px solid var(--gold); border-radius: 50%; opacity: 0; transform: translate(-50%, -50%) scale(.45); }
    .score-bonus { position: absolute; top: 100%; right: 0; margin-top: 4px; padding: 2px 7px; border-radius: 9px; background: #fff7dc; color: #99631b; font-size: 16px; font-weight: 800; line-height: 1.25; white-space: nowrap; box-shadow: 0 2px 8px #ad7a2520; opacity: 0; }
    .score-spark { position: absolute; left: 50%; top: 50%; color: #d69832; font-size: 14px; line-height: 1; opacity: 0; }
    .score-spark:nth-of-type(2) { --spark-x: -27px; --spark-y: -14px; }
    .score-spark:nth-of-type(3) { --spark-x: 17px; --spark-y: -16px; }
    .score-spark:nth-of-type(4) { --spark-x: -24px; --spark-y: 18px; }
    .score-spark:nth-of-type(5) { --spark-x: 15px; --spark-y: 18px; }
    .score.earned { animation: score-glow .68s ease-out; }
    .score.earned strong { display: inline-block; animation: pop .35s ease-out; }
    .score.earned .score-burst::before { animation: score-ring .68s ease-out; }
    .score.earned .score-bonus { animation: score-gain 1s ease-out both; }
    .score.earned .score-spark { animation: score-spark .68s ease-out both; }
    .lesson { position: relative; overflow: hidden; display: grid; grid-template-columns: 260px 1fr; gap: 36px; padding: 31px 42px 32px; background: #fffdf7; border: 1px solid #e6e3d6; border-radius: 30px; box-shadow: 0 8px 32px #4b604b06; }
    .friend { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .cat-scene { width: 234px; height: 216px; position: relative; display: grid; place-items: center; }
    .cat-scene::before { content: ''; width: 190px; height: 190px; border-radius: 50%; background: #f6edda; position: absolute; }
    .cat { width: 218px; height: 202px; position: relative; overflow: visible; transform-origin: 50% 90%; }
    .emoji { font-size: 112px; position: relative; line-height: 1.5; }
    .meaning-art { position: relative; width: 210px; padding: 16px; text-align: center; }
    .meaning-art strong { display: block; font-size: 28px; line-height: 1.5; overflow-wrap: anywhere; }
    .meaning-art span { display: block; margin-top: 10px; color: #8d795b; font-size: 13px; }
    .friend-caption { margin: 4px 0 0; color: #8d795b; font-size: 13px; }
    .task { align-self: center; }
    h1 { font-size: clamp(24px, 3.5vw, 34px); margin: 0; letter-spacing: 1px; }
    .word-reward { display: inline-flex; align-items: center; gap: 9px; max-width: 100%; margin: 13px 0 0; padding: 9px 15px; border: 1px solid #e4bf73; border-radius: 14px; background: #fff0c9; color: #855a18; box-shadow: 0 3px 0 #ead7a8; }
    .word-reward .reward-star { color: #ba7d1e; font-size: 25px; }
    .word-reward .reward-label { font-size: 13px; font-weight: 650; }
    .word-reward strong { font-size: 25px; line-height: 1.2; white-space: nowrap; }
    .reward-rule { margin: 8px 0 0; color: #8a806b; font-size: 11px; line-height: 1.7; }
    .instruction { margin: 10px 0 21px; font-size: 15px; color: #788176; line-height: 1.7; }
    .slots { display: flex; flex-wrap: wrap; gap: 11px; }
    .slot { width: 72px; height: 80px; display: grid; place-items: center; border-radius: 16px; border: 2px solid #e8e7dc; background: #f6f5ed; color: #a9b1a3; font-size: 39px; font-weight: 750; position: relative; transition: background .2s, border-color .2s, color .2s; }
    .slot.current { border-color: #799b77; box-shadow: 0 0 0 4px #dfe9d657; }
    .slot.current::after { content: ''; width: 20px; height: 3px; position: absolute; bottom: 10px; border-radius: 2px; background: #6a8a63; }
    .slot.filled { color: #fffdf7; background: var(--green); border-color: var(--green); animation: pop .23s ease-out; }
    .slot.listening { box-shadow: 0 0 0 4px #e7aa5040; border-color: #d6a55e; }
    .slot.word-start { margin-left: 14px; }
    .slots.long-word { gap: 8px; }
    .slots.long-word .slot { width: 58px; height: 66px; font-size: 32px; }
    .progress { margin: 13px 0 0; font-size: 12px; color: #8b9284; }
    .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; margin-top: 21px; }
    .listen { border: 1px solid #d9e2d4; background: #edf2e7; color: var(--green); padding: 11px 17px; border-radius: 13px; font-size: 14px; font-weight: 650; }
    .listen:hover { background: #e1ead8; }
    .listen svg { width: 17px; height: 17px; vertical-align: -3px; margin-right: 7px; }
    .audio-state { color: #8b8874; font-size: 12px; min-height: 19px; }
    .feedback { min-height: 29px; margin: 20px 0 0; line-height: 1.8; font-size: 15px; font-weight: 550; color: #57715a; }
    .keyboard-area { margin-top: 25px; }
    .keyboard-heading { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin: 0 5px 14px; }
    .keyboard-heading h2 { margin: 0; font-size: 15px; font-weight: 650; }
    .keyboard-heading p { margin: 0; color: #8a8f80; font-size: 12px; }
    .keyboard-shell { padding: 21px 25px 24px; border: 1px solid #dedccd; border-radius: 25px; background: #e8e6da; box-shadow: 0 7px 0 #d4d2c5; }
    .row { display: flex; justify-content: center; gap: 9px; margin-bottom: 11px; }
    .row:last-child { margin-bottom: 0; }
    .key { width: 8.9%; max-width: 77px; height: 65px; border: 1px solid #e2ddcd; border-radius: 12px; background: #fffdf5; color: #3c5d4c; box-shadow: 0 4px 0 #c4c3b4; font-size: 26px; font-weight: 700; transition: transform .12s, background .12s; }
    .key.available:hover, .key.pressed { background: #eef2dc; transform: translateY(2px); box-shadow: 0 2px 0 #b7baa5; }
    .key:disabled { background: #e3e2d7; color: #b0b3a5; border-color: #dbdccf; box-shadow: 0 2px 0 #d1d1c3; }
    .key.correct { background: var(--green); color: white; box-shadow: 0 2px 0 #254a40; }
    .key.try-again { background: #f4dfb8; border-color: #ddb36b; animation: nudge .3s ease; }
    .key.shift-key { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; flex-shrink: 0; width: 15%; max-width: 120px; padding: 4px; font-size: 14px; }
    .key.shift-key:hover { background: #eef2dc; }
    .key.shift-key[aria-pressed="true"] { background: var(--green); color: #fffdf7; border-color: #254a40; transform: translateY(3px); box-shadow: 0 1px 0 #254a40, inset 0 2px 5px #173e3440; }
    .shift-state { font-size: 11px; font-weight: 500; opacity: .85; }
    .keyboard-note { display: flex; justify-content: space-between; gap: 12px; margin: 19px 5px 0; color: #8a9081; font-size: 12px; line-height: 1.7; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #d9b56c; margin-right: 7px; }
    .audio-notice { min-height: 21px; text-align: center; color: #8b806a; font-size: 12px; line-height: 1.7; margin: 19px 0 0; }
    .completion { margin-top: 17px; }
    .completion p { margin: 0 0 13px; color: #697b60; font-size: 14px; }
    .next { border: 0; border-radius: 13px; background: var(--green); color: white; font-size: 15px; font-weight: 650; padding: 12px 23px; box-shadow: 0 3px 0 #254a40; }
    .next:hover { background: #2e594d; }
    [hidden] { display: none !important; }
    .lesson.complete .cat, .lesson.complete .emoji, .lesson.complete .meaning-art { animation: cat-dance .6s ease-in-out 3; }
    .lesson.complete .cat-scene::before { background: #e8efdb; }
    .sparkles { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
    .complete .sparkles { opacity: 1; }
    .sparkles span { position: absolute; color: #dca54d; font-size: 23px; animation: twinkle 1.2s ease-in-out 3; }
    .sparkles span:nth-child(1) { left: 4%; top: 20%; }
    .sparkles span:nth-child(2) { right: 2%; top: 11%; animation-delay: .2s; }
    .sparkles span:nth-child(3) { right: 3%; bottom: 20%; animation-delay: .4s; }
    @keyframes pop { 50% { transform: scale(1.08); } }
    @keyframes score-glow { 35% { background: #ffe3a1; box-shadow: 0 0 0 5px #e7aa5028, 0 0 20px #e7aa5040; transform: scale(1.06); } }
    @keyframes score-ring { 20% { opacity: .8; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.8); } }
    @keyframes score-gain { 0% { opacity: 0; transform: translateY(4px) scale(.7); } 20%, 55% { opacity: 1; transform: translateY(-3px) scale(1); } 100% { opacity: 0; transform: translateY(-22px) scale(.95); } }
    @keyframes score-spark { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.3); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) translate(var(--spark-x), var(--spark-y)) scale(.8) rotate(35deg); } }
    @keyframes nudge { 30% { transform: translateX(-3px); } 65% { transform: translateX(3px); } }
    @keyframes cat-dance { 25% { transform: translateY(-9px) rotate(-5deg); } 75% { transform: translateY(-9px) rotate(5deg); } }
    @keyframes twinkle { 50% { transform: scale(1.25) rotate(15deg); } }
    @media (max-width: 740px) {
      main { padding: 20px 16px; }
      .lesson { grid-template-columns: 180px 1fr; gap: 16px; padding: 26px 23px; }
      .cat-scene { width: 175px; height: 177px; }
      .cat-scene::before { width: 155px; height: 155px; }
      .cat { width: 180px; }
      .slot { width: 58px; height: 66px; font-size: 32px; }
      .keyboard-shell { padding: 18px 12px 22px; }
      .row { gap: 6px; }
      .key { height: 57px; font-size: 23px; }
    }
    @media (max-width: 520px) {
      .brand { font-size: 16px; }
      .score { padding: 6px 9px; }
      .lesson { grid-template-columns: 1fr; gap: 13px; padding: 19px 22px 23px; }
      .cat-scene { height: 136px; }
      .cat-scene::before { width: 126px; height: 126px; }
      .cat { width: 150px; height: 140px; }
      .meaning-art { width: 175px; padding: 10px; }
      .meaning-art strong { font-size: 22px; }
      .friend-caption { margin-top: 0; }
      .task { text-align: center; }
      h1 { font-size: 25px; }
      .instruction { margin: 7px 0 15px; font-size: 13px; }
      .slots, .actions { justify-content: center; }
      .actions { margin-top: 16px; gap: 10px; }
      .feedback { margin-top: 14px; font-size: 13px; }
      .slots.long-word { gap: 6px; }
      .slots.long-word .slot { width: 40px; height: 48px; font-size: 26px; border-radius: 12px; }
      .keyboard-heading p { font-size: 11px; }
      .keyboard-shell { padding: 15px 8px 20px; }
      .row { gap: 4px; }
      .key { width: 9.5%; height: 48px; font-size: 20px; border-radius: 8px; }
      .key.shift-key { width: 16%; font-size: 11px; }
      .shift-state { font-size: 10px; }
      .keyboard-note { flex-direction: column; gap: 3px; }
      .audio-notice { margin-top: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .score.earned .score-bonus { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
<main>
  <header class="header">
    <p class="brand"><span aria-hidden="true">Aa</span>单词小冒险</p>
    <div class="score" id="score-badge" role="status" aria-live="polite" aria-atomic="true">
      <span aria-hidden="true">★</span><span>积分 <span class="score-value"><strong id="score">0</strong><span class="score-burst" aria-hidden="true"><span class="score-bonus" id="score-bonus">+0.5</span><span class="score-spark">✦</span><span class="score-spark">✧</span><span class="score-spark">✧</span><span class="score-spark">✦</span></span></span></span>
    </div>
  </header>
  <section class="lesson" id="lesson" aria-labelledby="task-title">
    <div class="friend">
      <div class="cat-scene">
        <svg class="cat" id="cat-art" viewBox="0 0 240 220" role="img" aria-label="一只等你帮忙拼单词的小猫">
          <ellipse cx="122" cy="198" rx="67" ry="9" fill="#dbcfb7" opacity=".6"/>
          <path d="M165 172 Q210 180 199 141 Q193 124 205 115" fill="none" stroke="#d6a566" stroke-width="17" stroke-linecap="round"/>

          <path d="M77 68 L75 44 L96 59 M151 60 L171 44 L168 72" fill="#dd9b87"/>
          <path d="M72 88 Q75 52 123 53 Q169 54 178 88 Q187 145 126 151 Q67 148 72 88" fill="#edc58d" stroke="#bf8b53" stroke-width="2.5"/>

          <ellipse cx="100" cy="105" rx="5" ry="7" fill="#4b493a"/><ellipse cx="149" cy="105" rx="5" ry="7" fill="#4b493a"/>

      <p class="friend-caption" id="friend-caption">一位小伙伴，等你来认识</p>

    <div class="task">
      <h1 id="task-title">帮小猫拼出它的名字</h1>
      <p class="word-reward" id="word-reward" aria-describedby="reward-rule"><span class="reward-star" aria-hidden="true">★</span><span class="reward-label">本词奖励</span><strong id="word-points">0.5 分</strong></p>
      <p class="reward-rule" id="reward-rule">1–3 个字母：0.5 分 · 4–6 个：1 分 · 7 个及以上：2 分（空格不计）</p>

    <div class="keyboard-note"><span><span class="dot" aria-hidden="true"></span>亮着的字母都可以试一试，按错也没关系。</span><span>轻轻按一下，长按不会重复输入。</span></div>
  </section>
  <p class="audio-notice" id="audio-notice" role="status"></p>
  <noscript><p>请启用 JavaScript，开始单词小冒险。</p></noscript>

<script src="word-adventure-words.js"></script>
<script>
(() => {
  'use strict';

  // 页面级默认难度，可通过 URL 覆盖：?distractorCount=4&showSpelling=false。
  const DEFAULT_GAME_OPTIONS = Object.freeze({ distractorCount: 2, showSpelling: true });
  const optionParams = new URLSearchParams(window.location.search);
  const requestedCount = optionParams.get('distractorCount');
  const requestedSpelling = optionParams.get('showSpelling');
  const GAME_OPTIONS = Object.freeze({
    distractorCount: requestedCount !== null && /^\d+$/.test(requestedCount) && Number(requestedCount) <= 26
      ? Number(requestedCount) : DEFAULT_GAME_OPTIONS.distractorCount,
    showSpelling: requestedSpelling === 'false' ? false
      : requestedSpelling === 'true' ? true : DEFAULT_GAME_OPTIONS.showSpelling
  });

  // 单词只保存内容；干扰字母按不同字母数计算，数量最多为剩余可选字母数。
  const WORD_POOL = window.WORD_ADVENTURE_WORDS;
  const NEXT_WORD_DELAY = 1000;
  const HOVER_DELAY = 240;
  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const rows = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
  const $ = id => document.getElementById(id);
  const synth = window.speechSynthesis;
  const supported = !!synth && typeof window.SpeechSynthesisUtterance === 'function';
  const buttons = new Map(), held = new Set(), flashTimers = new Map();
  let currentWord, position = 0, complete = false, choices = new Set();
  // 只切换显示形式，词库、按键匹配和朗读文本继续使用原始内容。
  let lowercaseLetters = false;
  let feedbackText = $('feedback').textContent, audioStateText = $('audio-state').textContent;
  let nextWordTimer = null;
  let voices = [], audioRole = null, audioGeneration = 0, audioTimer = null, speechWatchdog = null;
  let activeUtterance = null, hoverTimer = null, needsGesture = false;
  let hoveredLetter = null, hoverReady = false;
  const SCORE_STORAGE_KEY = 'word-adventure-score-v1';
  function loadSavedScore() {
    try {
      const saved = window.localStorage.getItem(SCORE_STORAGE_KEY);
      if (saved === null) return 0;
      const value = Number(saved);
      // 兼容旧版整数积分，同时允许以半分为单位保存的新积分。
      return value >= 0 && Number.isSafeInteger(value * 2) ? value : 0;
    } catch (_) { return 0; }
  }
  function saveScore() {
    try { window.localStorage.setItem(SCORE_STORAGE_KEY, String(score)); } catch (_) {}
  }
  function wordReward(letterCount) {
    // 按需要输入的字母数分成三档，短语中的空格不计入。
    return letterCount <= 3 ? .5 : letterCount <= 6 ? 1 : 2;
  }
  // 积分跨刷新和重新打开页面保留。
  let score = loadSavedScore(), effectsContext = null;
  $('score').textContent = score;
  const effectNotes = new Set();

  function prepareEffects() {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return null;
    try {
      if (!effectsContext) effectsContext = new AudioContext();
      if (effectsContext.state === 'suspended') effectsContext.resume().catch(() => {});
      return effectsContext;
    } catch (_) { return null; }
  }

  function stopEffects() {
    for (const note of effectNotes) {
      try { note.stop(); } catch (_) {}
    }
  }

  function playVictorySound() {
    const context = prepareEffects();
    if (!context) return 0;
    stopEffects();
    try {
      const start = context.currentTime + .02;
      // 四个逐渐上行的音符，自带轻柔包络，无需外部音频文件。
      [523.25, 659.25, 783.99, 1046.5].forEach((frequency, index) => {
        const note = context.createOscillator();
        const gain = context.createGain();
        const time = start + index * .12;
        note.type = 'triangle'; note.frequency.setValueAtTime(frequency, time);
        gain.gain.setValueAtTime(0, time);
        gain.gain.linearRampToValueAtTime(.1, time + .015);
        gain.gain.exponentialRampToValueAtTime(.001, time + .24);
        note.connect(gain); gain.connect(context.destination);
        effectNotes.add(note);
        note.onended = () => { effectNotes.delete(note); note.disconnect(); gain.disconnect(); };
        note.start(time); note.stop(time + .27);
      });
      return 680;
    } catch (_) { stopEffects(); return 0; }
  }

  function playErrorSound() {
    const context = prepareEffects();
    if (!context) return 0;
    try {
      const note = context.createOscillator();
      const gain = context.createGain();
      const start = context.currentTime + .01;
      note.type = 'triangle';
      note.frequency.setValueAtTime(330, start);
      note.frequency.exponentialRampToValueAtTime(220, start + .16);
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(.09, start + .015);
      gain.gain.exponentialRampToValueAtTime(.001, start + .19);
      note.connect(gain); gain.connect(context.destination);
      effectNotes.add(note);
      note.onended = () => { effectNotes.delete(note); note.disconnect(); gain.disconnect(); };
      note.start(start); note.stop(start + .21);
      return 220;
    } catch (_) { return 0; }
  }

  function validateWord(config) {
    if (!config || typeof config.id !== 'string' || !/^[A-Z]+(?: [A-Z]+)*$/.test(config.word) ||
        typeof config.meaning !== 'string' || !config.meaning.trim() || typeof config.illustration !== 'string' ||
        (config.speech !== undefined && (typeof config.speech !== 'string' || !config.speech.trim()))) {
      throw new Error('词条需要英文大写单词或短语、中文含义和有效的图示配置。');
    }
  }
  if (!Array.isArray(WORD_POOL) || !WORD_POOL.length) {
    $('audio-notice').textContent = '单词表未能加载。请将页面与词表文件放在同一文件夹，再刷新页面。';
    $('listen').disabled = true;
    $('letter-case').disabled = true;
    return;
  }
  WORD_POOL.forEach(validateWord);

  function drawWord() {
    // 每次从完整单词池等概率抽取，不移除已抽取的词，也允许连续抽到同一个词。
    return WORD_POOL[Math.floor(Math.random() * WORD_POOL.length)];
  }

  function scheduleNextWord() {
    clearTimeout(nextWordTimer); nextWordTimer = null;
    if (!complete || document.hidden || audioRole === 'celebration') return;
    nextWordTimer = setTimeout(() => {
      nextWordTimer = null;
      if (complete && !document.hidden) startWord();
    }, NEXT_WORD_DELAY);
  }

  function chooseLetters(config) {
    const required = new Set(config.letters);
    const pool = [...alphabet].filter(letter => !required.has(letter));
    // 按词条 ID 固定干扰字母，同一词条再次出现时不会改变键盘。
    let seed = 2166136261;
    for (const char of config.id) seed = Math.imul(seed ^ char.charCodeAt(0), 16777619) >>> 0;
    for (let i = pool.length - 1; i > 0; i--) {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      const j = seed % (i + 1);
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return new Set([...required, ...pool.slice(0, GAME_OPTIONS.distractorCount)]);
  }

  function refreshVoices() { if (supported) voices = synth.getVoices(); }
  function clearHover() {
    clearTimeout(hoverTimer); hoverTimer = null;
    hoveredLetter = null; hoverReady = false;
  }
  // 悬停只替换悬停语音；提示和按键反馈优先，结束后再读仍停留的最新字母。
  function playHoveredLetter() {
    if (!supported || document.hidden || needsGesture || complete || !hoverReady || !hoveredLetter ||
        buttons.get(hoveredLetter)?.disabled || (audioRole && audioRole !== 'hover')) return;
    const letter = hoveredLetter;
    hoverReady = false; // 每次停留只读一次，不能在语音结束后循环重读。
    playSequence([{ text: letter, letter: true }], 'hover');
  }
  function requestHover(letter) {
    clearHover();
    if (!supported || document.hidden || complete || buttons.get(letter)?.disabled) return;
    hoveredLetter = letter;
    hoverTimer = setTimeout(() => {
      hoverTimer = null; hoverReady = true;
      playHoveredLetter();
    }, HOVER_DELAY);
  }
  function clearListening() { for (const slot of $('slots').children) slot.classList.remove('listening'); }
  function stopAudio() {
    audioGeneration++;
    clearTimeout(audioTimer); clearTimeout(speechWatchdog);
    audioTimer = null; speechWatchdog = null; activeUtterance = null; audioRole = null;
    clearListening();
    if (supported) synth.cancel();
    $('listen').removeAttribute('aria-busy');
    renderAudioState(complete ? '你已经拼出整个单词啦' : '随时可以按字母，不用等提示');
  }

  // 语音独立于输入进度。只有当前播放批次可以更新界面，取消后的回调不会干扰新输入。
  function playSequence(steps, role, startDelay = 0) {
    stopAudio();
    if (!supported || document.hidden) return;
    refreshVoices();
    const generation = audioGeneration;
    let voiceNotice = '';
    audioRole = role;
    if (role === 'celebration') {
      clearTimeout(nextWordTimer); nextWordTimer = null;
    }
    if (role === 'prompt') $('listen').setAttribute('aria-busy', 'true');
    function finish() {
      if (generation !== audioGeneration) return;
      clearTimeout(speechWatchdog); clearTimeout(audioTimer);
      activeUtterance = null; audioRole = null; clearListening();
      $('listen').removeAttribute('aria-busy');
      renderAudioState(complete ? '你已经拼出整个单词啦' : '轮到你啦，找找下一个字母');
      if (complete) scheduleNextWord();
      else playHoveredLetter();
    }
    function fail(error) {
      if (generation !== audioGeneration) return;
      clearHover(); stopAudio();
      if (error === 'not-allowed') {
        needsGesture = true;
        $('audio-notice').textContent = '直接点击或按下一个字母，声音就会自动开始。';
      } else if (error === 'language-unavailable' || error === 'voice-unavailable') {
        $('audio-notice').textContent = '暂时没有英文声音，可以先看着字母拼写。请在电脑上添加英文语音。';
      } else {
        $('audio-notice').textContent = '这次没听清？可以点“再听一次”，拼好的字母会保留。';
      }
      if (complete) scheduleNextWord();
    }
    function run(index) {
      if (generation !== audioGeneration) return;
      if (index >= steps.length) { finish(); return; }
      const step = steps[index];
      const speech = new SpeechSynthesisUtterance(step.text);
      activeUtterance = speech;
      const chinese = step.lang === 'zh-CN';
      speech.lang = step.lang || 'en-US';
      speech.rate = chinese ? .85 : step.letter ? 1.0 : .72;
      const candidates = voices.filter(voice => (chinese ? /^zh(?:-|$)/i : /^en(?:-|$)/i).test(voice.lang));
      const preferred = voice => (chinese ? /^zh-(?:CN|Hans(?:-CN)?)$/i : /^en-US$/i).test(voice.lang);
      speech.voice = candidates.find(voice => preferred(voice) && voice.localService) ||
        candidates.find(preferred) || candidates.find(voice => voice.localService) || candidates[0] || null;
      // 中文语音不可用时跳过释义，保留英文和字母提示。
      function handleError(error) {
        if (chinese && (error === 'language-unavailable' || error === 'voice-unavailable')) {
          clearTimeout(speechWatchdog); clearListening();
          voiceNotice = '暂时没有中文声音，中文释义仍可看。请在设备上添加普通话语音后再试。';
          $('audio-notice').textContent = voiceNotice;
          audioTimer = setTimeout(() => run(index + 1), 380);
        } else fail(error);
      }
      let settled = false;
      speech.onstart = () => {
        if (generation !== audioGeneration || settled) return;
        needsGesture = false; $('audio-notice').textContent = voiceNotice;
        clearListening();
        if (Number.isInteger(step.slot)) $('slots').children[step.slot]?.classList.add('listening');
        renderAudioState((role === 'prompt' ? '听一听 · ' : '正在读 · ') + step.text);
      };
      speech.onend = () => {
        if (generation !== audioGeneration || settled) return;
        settled = true; clearTimeout(speechWatchdog); clearListening();
        audioTimer = setTimeout(() => run(index + 1), step.letter ? 100 : 380);
      };
      speech.onerror = event => {
        if (generation !== audioGeneration || settled) return;
        settled = true; handleError(event.error);
      };
      // 某些系统缺少语音时不发送结束事件；输入仍然可用，超时后恢复悬停提示。
      speechWatchdog = setTimeout(() => { if (!settled) { settled = true; fail('timeout'); } }, 10000);
      try { synth.speak(speech); } catch (_) { fail('failed'); }
    }
    if (startDelay) audioTimer = setTimeout(() => run(0), startDelay);
    else run(0);
  }

  function playPrompt(startDelay = 0) {
    const wordAndMeaning = [
      { text: currentWord.speech },
      { text: currentWord.meaning, lang: 'zh-CN' }
    ];
    const spelling = [...currentWord.letters].map((letter, slot) => ({ text: letter, letter: true, slot }));
    if (complete) {
      // 输入时的字母语音可能被后续按键打断；拼对后重新从首字母完整拼读。
      playSequence([...spelling, ...wordAndMeaning], 'celebration', startDelay);
      return;
    }
    playSequence([
      ...wordAndMeaning,
      ...spelling,
      ...wordAndMeaning
    ], 'prompt');
  }

  function displayLetters(text) {
    return lowercaseLetters ? text.toLowerCase() : text.toUpperCase();
  }

  function renderFeedback(text) {
    feedbackText = text;
    $('feedback').textContent = displayLetters(text);
  }

  function renderAudioState(text) {
    audioStateText = text;
    $('audio-state').textContent = displayLetters(text);
  }

  function renderLetterCase() {
    $('letter-case').setAttribute('aria-pressed', String(!lowercaseLetters));
    $('shift-state').textContent = lowercaseLetters ? '小写' : '大写';
    buttons.forEach((button, letter) => {
      button.textContent = displayLetters(letter);
      button.setAttribute('aria-label', '字母 ' + displayLetters(letter));
    });
    $('instruction').textContent = GAME_OPTIONS.showSpelling
      ? currentWord.meaning + '的英文是 ' + displayLetters(currentWord.display) + '。听一听，再按顺序找字母。'
      : '听听“' + currentWord.meaning + '”的英文，再按顺序找字母。';
    if (currentWord.word.includes(' ')) $('instruction').textContent += '词间空格已分隔，只需输入字母。';
    renderProgress(); renderFeedback(feedbackText); renderAudioState(audioStateText);
  }

  function renderProgress() {
    [...$('slots').children].forEach((slot, index) => {
      const filled = index < position;
      slot.textContent = filled || GAME_OPTIONS.showSpelling ? displayLetters(currentWord.letters[index]) : '·';
      slot.classList.toggle('filled', filled);
      slot.classList.toggle('current', index === position && !complete);
      if (index === position && !complete) slot.setAttribute('aria-current', 'step');
      else slot.removeAttribute('aria-current');
      slot.setAttribute('aria-label', '第 ' + (index + 1) + ' 个字母' + (filled ? '，已拼好 ' + displayLetters(currentWord.letters[index]) : '，待填写'));
    });
    $('progress').textContent = '已找到 ' + position + ' / ' + currentWord.letters.length + ' 个字母';
    $('slots').setAttribute('aria-label', '单词拼写进度，已找到 ' + position + ' 个，共 ' + currentWord.letters.length + ' 个字母');
  }

  function flash(letter, className) {
    const button = buttons.get(letter);
    clearTimeout(flashTimers.get(letter));
    button.classList.remove('correct', 'try-again');
    button.classList.add(className);
    flashTimers.set(letter, setTimeout(() => {
      button.classList.remove(className); flashTimers.delete(letter);
    }, 380));
  }

  function inputLetter(letter) {
    if (complete) return;
    clearHover();
    if (!choices.has(letter)) {
      stopAudio();
      renderFeedback('找找亮着的字母，它们都可以试一试。');
      playErrorSound();
      return;
    }
    prepareEffects();
    const correct = letter === currentWord.letters[position];
    if (!correct) {
      flash(letter, 'try-again');
      renderFeedback('这是 ' + letter + '。再找找第 ' + (position + 1) + ' 个字母，慢慢来。');
      const soundDuration = playErrorSound();
      playSequence([{ text: letter, letter: true }], 'letter', soundDuration);
      return;
    }
    position++;
    flash(letter, 'correct');
    complete = position === currentWord.letters.length;
    renderProgress();
    if (complete) {
      score += currentWord.points;
      $('score').textContent = score;
      $('score-bonus').textContent = '+' + currentWord.points;
      saveScore();
      $('score-badge').classList.add('earned');
      $('lesson').classList.add('complete');
      $('task-title').textContent = '太棒啦，你拼出来了！';
      renderFeedback(currentWord.word + '，就是“' + currentWord.meaning + '”！');
      $('friend-caption').textContent = '又认识了一个英文单词！';
      $('completion-message').textContent = '拼对 +' + currentWord.points + ' 分！你已经获得 ' + score + ' 分啦。即将认识下一个单词。';
      $('completion').hidden = false;
      buttons.forEach(button => { button.disabled = true; });
      const soundDuration = playVictorySound();
      playPrompt(soundDuration);
      scheduleNextWord();
    } else {
      renderFeedback('找对了 ' + letter + '！继续找第 ' + (position + 1) + ' 个字母吧。');
      playSequence([{ text: letter, letter: true }], 'letter');
    }
  }

  for (const letters of rows) {
    const row = document.createElement('div'); row.className = 'row';
    if (letters === rows[2]) row.appendChild($('letter-case'));
    for (const letter of letters) {
      const button = document.createElement('button');
      button.type = 'button'; button.className = 'key'; button.textContent = letter;
      button.dataset.letter = letter; button.setAttribute('aria-label', '字母 ' + letter);
      button.addEventListener('click', () => inputLetter(letter));
      button.addEventListener('pointerenter', event => {
        if (event.pointerType !== 'touch') requestHover(letter);
      });
      button.addEventListener('pointerleave', () => {
        if (hoveredLetter === letter) clearHover();
      });
      buttons.set(letter, button); row.appendChild(button);
    }
    $('keyboard').appendChild(row);
  }

  function clearHeld() {
    held.clear(); clearHover(); buttons.forEach(button => button.classList.remove('pressed'));
  }
  function startWord() {
    clearTimeout(nextWordTimer); nextWordTimer = null;
    stopAudio(); stopEffects(); clearHeld();
    flashTimers.forEach(timer => clearTimeout(timer)); flashTimers.clear();
    const config = drawWord();
    currentWord = { ...config, letters: config.word.replace(/ /g, ''), display: config.display || config.word.toLowerCase(), speech: config.speech || config.display || config.word.toLowerCase() };
    currentWord.points = wordReward(currentWord.letters.length);
    position = 0; complete = false;
    choices = chooseLetters(currentWord);
    $('lesson').classList.remove('complete'); $('completion').hidden = true;
    $('score-badge').classList.remove('earned');
    $('task-title').textContent = '一起拼出“' + currentWord.meaning + '”的英文';
    $('word-points').textContent = currentWord.points + ' 分';
    $('word-reward').setAttribute('aria-label', '本词共 ' + currentWord.letters.length + ' 个字母，拼对奖励 ' + currentWord.points + ' 分');
    $('friend-caption').textContent = '一个小单词，等你来认识';
    $('cat-art').style.display = currentWord.illustration === '🐱' ? '' : 'none';
    $('emoji-art').hidden = !currentWord.illustration || currentWord.illustration === '🐱';
    $('emoji-art').textContent = currentWord.illustration;
    $('emoji-art').setAttribute('role', 'img');
    $('emoji-art').setAttribute('aria-label', currentWord.meaning);
    $('emoji-art').setAttribute('aria-hidden', String($('emoji-art').hidden));
    $('meaning-art').hidden = !!currentWord.illustration;
    $('meaning-art-label').textContent = currentWord.meaning;
    $('slots').replaceChildren();
    $('slots').classList.toggle('long-word', currentWord.letters.length > 8);
    let wordStart = false;
    for (const letter of currentWord.word) {
      if (letter === ' ') { wordStart = true; continue; }
      const slot = document.createElement('div'); slot.className = 'slot' + (wordStart ? ' word-start' : '');
      wordStart = false; $('slots').appendChild(slot);
    }
    buttons.forEach((button, letter) => {
      button.className = 'key' + (choices.has(letter) ? ' available' : '');
      button.disabled = !choices.has(letter);
    });
    renderFeedback('从第一个字母开始，慢慢来。');
    renderLetterCase(); playPrompt();
    if (!supported) $('audio-notice').textContent = '这个浏览器暂不支持朗读，可以先看着字母拼写。';
  }

  function eventLetter(event) {
    if (/^Key[A-Z]$/.test(event.code)) return event.code.slice(3);
    return /^[a-zA-Z]$/.test(event.key) ? event.key.toUpperCase() : null;
  }
  document.addEventListener('keydown', event => {
    if (event.ctrlKey || event.metaKey || event.altKey || event.isComposing) return;
    if (event.target instanceof Element && event.target.closest('input,textarea,select,[contenteditable="true"]')) return;
    if (event.repeat && (event.key === 'Enter' || event.key === ' ') && event.target instanceof Element && event.target.closest('button')) {
      event.preventDefault(); return;
    }
    const letter = eventLetter(event);
    if (!letter || complete) return;
    event.preventDefault();
    if (event.repeat || held.has(letter)) return;
    held.add(letter);
    if (choices.has(letter)) buttons.get(letter).classList.add('pressed');
    inputLetter(letter);
  });
  document.addEventListener('keyup', event => {
    const letter = eventLetter(event);
    held.delete(letter); buttons.get(letter)?.classList.remove('pressed');
  });
  // 空白处的首次点击也能恢复浏览器拦截的开场提示，字母点击由输入逻辑负责。
  document.addEventListener('click', event => {
    if (event.isTrusted && needsGesture && !audioRole && position === 0 &&
        !(event.target instanceof Element && event.target.closest('button'))) playPrompt();
  });
  $('listen').addEventListener('click', () => { clearHover(); prepareEffects(); stopEffects(); playPrompt(); });
  $('letter-case').addEventListener('click', () => {
    lowercaseLetters = !lowercaseLetters;
    renderLetterCase();
  });
  $('next').addEventListener('click', () => { if (complete) startWord(); });
  window.addEventListener('blur', clearHeld);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      clearTimeout(nextWordTimer); nextWordTimer = null;
      clearHeld(); stopAudio(); stopEffects();
    } else if (complete) scheduleNextWord();
  });
  window.addEventListener('pagehide', () => {
    clearTimeout(nextWordTimer); nextWordTimer = null;
    clearHeld(); stopAudio(); stopEffects();
  });
  if (supported) { refreshVoices(); synth.addEventListener('voiceschanged', refreshVoices); }
  startWord();
})();
</script>
</body>
</html>
